<svg
  viewBox="0 0 24 24"
  [attr.width]="size()"
  [attr.height]="size()"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.aria-hidden]="label() ? null : 'true'"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label()"
  focusable="false"
>
  @for (d of paths(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
