@if (error(); as failure) {
  <div class="banner" role="alert">
    <app-icon name="alert-triangle" class="glyph" />
    <div class="text">
      <p class="title">{{ failure.title }}</p>

      @let message = failure.displayMessage;
      @if (message !== failure.title) {
        <p class="detail">{{ message }}</p>
      }
      @if (failure.status >= 500 && failure.traceId) {
        <p class="trace">Reference: <code>{{ failure.traceId }}</code></p>
      }
    </div>
    <button #retryButton type="button" class="btn btn-secondary btn-sm" (click)="onRetry()">
      <app-icon name="refresh" [size]="15" />
      Try again
    </button>
  </div>
}
