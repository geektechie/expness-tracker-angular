<a class="skip-link" href="#main" (click)="$event.preventDefault(); main.focus()">Skip to content</a>

<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark"><app-icon name="wallet" [size]="18" /></span>
      <span class="brand-name">Expense Tracker</span>
    </a>

    <nav class="nav" aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [attr.title]="item.label"
        >
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="themeDisplay().label + ' — change theme'"
        (click)="theme.cycle()"
      >
        <app-icon [name]="themeDisplay().icon" [size]="17" />
        <span>{{ themeDisplay().label }}</span>
      </button>
    </div>
  </aside>

  <main #main id="main" class="content" tabindex="-1" [attr.aria-label]="pageTitle()">
    <router-outlet />
  </main>
</div>

<app-toast-host />
